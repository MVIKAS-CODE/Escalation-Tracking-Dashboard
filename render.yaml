databases:
  - name: escalation-db
    databaseName: app_db
    user: postgres
    plan: free

services:
  - type: web
    name: escalation-tracking-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npx drizzle-kit push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: escalation-db
          property: connectionString
