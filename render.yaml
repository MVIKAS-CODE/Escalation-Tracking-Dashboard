databases:
  - name: escalation-db
    databaseName: app_db
    plan: free

services:
  - type: web
    name: escalation-tracking-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx drizzle-kit push && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: escalation-db
          property: connectionString
